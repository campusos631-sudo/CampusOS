<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KDP CampusOS | Announcements</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .ann { padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: #0e1626; }
    .ann.important { border-left: 4px solid var(--warn); background: rgba(251, 191, 36, .07); }
    .ann .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ann .body { margin: 6px 0; white-space: pre-wrap; }
    .imp { background: rgba(251, 191, 36, .2); color: var(--warn); }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--text); font-size: .95rem; }
    .check input { width: auto; }
    .del { margin-top: 8px; padding: 6px 12px; font-size: .8rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <span>
      <span class="brand"><img src="/img/logo.jpg" alt="KDP logo" />KDP CampusOS</span>
      <span class="nav" id="nav"></span>
    </span>
    <span>
      <span class="who" id="who"></span>
      <button class="btn secondary" id="logoutBtn" type="button">Logout</button>
    </span>
  </header>

  <main class="container">
    <section class="card hidden" id="createCard">
      <h2>New announcement</h2>
      <form id="form" novalidate>
        <label for="title">Title</label>
        <input id="title" maxlength="150" placeholder="GTU Internal Examination Schedule" />
        <label for="body">Description</label>
        <textarea id="body" maxlength="2000" placeholder="Internal examination will begin from Monday."></textarea>
        <label class="check"><input type="checkbox" id="important" /> Mark as important</label>
        <button class="btn block" id="submitBtn" type="submit">Publish announcement</button>
      </form>
      <div id="msg" class="msg"></div>
    </section>

    <section class="card">
      <h2>Announcements</h2>
      <div id="list"><div class="empty">Loading...</div></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let isAdmin = false;

    function buildNav(role) {
      const links = role === 'admin'
                ? [['/admin.html', 'Complaints'], ['/analytics.html', 'Analytics'], ['/announcements.html', 'Announcements'], ['/events.html', 'Events']]
        : [['/dashboard.html', 'Dashboard'], ['/announcements.html', 'Announcements'], ['/events.html', 'Events']];
      $('nav').innerHTML = '&nbsp;' + links.map(([href, label]) =>
        `<a href="${href}"${href === '/announcements.html' ? ' class="active"' : ''}>${label}</a>`).join('');
    }

    async function loadList() {
      const r = await api('/announcements');
      if (!r.ok) {
        $('list').innerHTML = '<div class="empty">Could not load announcements.</div>';
        return;
      }
      const list = r.data.announcements;
      if (list.length === 0) {
        $('list').innerHTML = '<div class="empty">No announcements yet.</div>';
        return;
      }
      $('list').innerHTML = list.map(a => `
        <div class="ann${a.is_important ? ' important' : ''}">
          <div class="head">
            <strong>${esc(a.title)}</strong>
            ${a.is_important ? '<span class="badge imp">Important</span>' : ''}
          </div>
          <div class="body">${esc(a.body)}</div>
          <div class="ticket">${fmtDate(a.created_at)}${a.created_by_name ? ' &middot; ' + esc(a.created_by_name) : ''}</div>
          ${isAdmin ? `<button class="btn secondary del" data-id="${a.id}" type="button">Delete</button>` : ''}
        </div>`).join('');
    }

    $('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      if (!confirm('Delete this announcement?')) return;
      const r = await api('/announcements/' + btn.dataset.id, { method: 'DELETE' });
      if (!r.ok) {
        alert(r.data.error || 'Could not delete');
        return;
      }
      loadList();
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('msg').className = 'msg';
      $('submitBtn').disabled = true;

      const r = await api('/announcements', {
        method: 'POST',
        body: JSON.stringify({
          title: $('title').value,
          body: $('body').value,
          is_important: $('important').checked,
        }),
      });
      $('submitBtn').disabled = false;

      if (!r.ok) {
        showMsg($('msg'), 'error', r.data.error || 'Could not publish');
        return;
      }
      showMsg($('msg'), 'ok', 'Announcement published. All students were notified.');
      $('form').reset();
      loadList();
    });

    $('logoutBtn').addEventListener('click', logout);

    (async () => {
      const user = await requireLogin();
      if (!user) return;
      isAdmin = user.role === 'admin';
      $('who').textContent = user.name;
      buildNav(user.role);
      if (isAdmin) $('createCard').classList.remove('hidden');
      loadList();
    })();
  </script>
</body>
</html>
